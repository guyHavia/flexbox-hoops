<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Hoops</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff7a1a'/%3E%3Cpath d='M1 16h30M16 1v30M5 5q11 11 0 22M27 5q-11 11 0 22' stroke='%232a1200' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header__row">
        <h1 class="app-title">
          <span class="app-title__ball" aria-hidden="true"></span>
          Flexbox<span class="app-title__accent">Hoops</span>
        </h1>
        <div class="level-indicator" id="level-indicator"></div>
      </div>
      <nav class="level-nav" id="level-nav"></nav>
      <div class="progress-rail" role="presentation">
        <div class="progress-rail__fill" id="progress-fill"></div>
      </div>
    </header>

    <main class="game-main">
      <div class="court-wrapper">
        <div class="court" id="court">
          <div class="court-layer court-layer--baskets" id="basket-layer"></div>
          <div class="court-layer court-layer--balls" id="ball-layer"></div>

          <div class="success-overlay" id="success-overlay" hidden>
            <svg class="success-overlay__scene" width="300" height="198" viewBox="0 0 300 198" role="img" aria-label="Illustration of a player making a jump shot through the hoop" focusable="false">
              <defs>
                <radialGradient id="sg-head" cx="34%" cy="26%" r="80%">
                  <stop offset="0%" style="stop-color:var(--navy-300)"/>
                  <stop offset="55%" style="stop-color:var(--navy-600)"/>
                  <stop offset="100%" style="stop-color:var(--navy-900)"/>
                </radialGradient>
                <linearGradient id="sg-torso" x1="10%" y1="0%" x2="85%" y2="100%">
                  <stop offset="0%" style="stop-color:#31459c"/>
                  <stop offset="55%" style="stop-color:var(--navy-900)"/>
                  <stop offset="100%" style="stop-color:#101b45"/>
                </linearGradient>
                <linearGradient id="sg-limb" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#3f56ab"/>
                  <stop offset="100%" style="stop-color:var(--navy-900)"/>
                </linearGradient>
                <radialGradient id="sg-ball" cx="34%" cy="26%" r="78%">
                  <stop offset="0%" style="stop-color:#ffab68"/>
                  <stop offset="58%" style="stop-color:#e8701a"/>
                  <stop offset="100%" style="stop-color:#bf560f"/>
                </radialGradient>
                <linearGradient id="sg-board" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#ffffff"/>
                  <stop offset="100%" style="stop-color:#dbe2f2"/>
                </linearGradient>
                <linearGradient id="sg-rim" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:var(--orange-500)"/>
                  <stop offset="100%" style="stop-color:var(--orange-600)"/>
                </linearGradient>
                <linearGradient id="sg-shoe" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:var(--orange-500)"/>
                  <stop offset="100%" style="stop-color:var(--orange-600)"/>
                </linearGradient>
                <radialGradient id="sg-court" cx="46%" cy="112%" r="95%">
                  <stop offset="0%" style="stop-color:var(--wood-1)"/>
                  <stop offset="60%" style="stop-color:var(--wood-2)"/>
                  <stop offset="100%" style="stop-color:var(--wood-3)"/>
                </radialGradient>
              </defs>

              <g class="success-overlay__floor">
                <path class="success-overlay__floor-boards" d="M -10 110 L 310 110 L 310 198 L -10 198 Z"/>
                <g class="success-overlay__floor-planks">
                  <line x1="-10" y1="110" x2="-10" y2="198"/>
                  <line x1="30" y1="110" x2="30" y2="198"/>
                  <line x1="70" y1="110" x2="70" y2="198"/>
                  <line x1="110" y1="110" x2="110" y2="198"/>
                  <line x1="150" y1="110" x2="150" y2="198"/>
                  <line x1="190" y1="110" x2="190" y2="198"/>
                  <line x1="230" y1="110" x2="230" y2="198"/>
                  <line x1="270" y1="110" x2="270" y2="198"/>
                  <line x1="310" y1="110" x2="310" y2="198"/>
                </g>
                <path class="success-overlay__floor-arc" d="M 84 198 Q 132 118 235 112 Q 284 116 300 152"/>
                <path class="success-overlay__floor-lane" d="M 280 198 L 192 198 L 202 132 L 270 132 Z"/>
                <path class="success-overlay__floor-circle" d="M 202 132 A 34 15 0 0 1 270 132"/>
              </g>

              <g class="success-overlay__hoop">
                <rect class="success-overlay__hoop-pole" x="231.5" y="44" width="7" height="154" rx="1.5"/>
                <rect class="success-overlay__hoop-backboard" x="212" y="36" width="46" height="38" rx="3"/>
                <rect class="success-overlay__hoop-square" x="223" y="56" width="24" height="16"/>
                <path class="success-overlay__hoop-net" d="M 219 80 L 251 80 L 244 108 L 226 108 Z"/>
                <g class="success-overlay__hoop-net-lines">
                  <line x1="222" y1="80" x2="229" y2="108"/>
                  <line x1="230" y1="80" x2="234" y2="108"/>
                  <line x1="235" y1="80" x2="235" y2="108"/>
                  <line x1="240" y1="80" x2="236" y2="108"/>
                  <line x1="248" y1="80" x2="241" y2="108"/>
                </g>
                <ellipse class="success-overlay__hoop-rim" cx="235" cy="80" rx="20" ry="4.5"/>
              </g>

              <g class="shooter">
                <ellipse class="shooter__shadow" cx="62" cy="196" rx="28" ry="4.5"/>

                <g class="shooter__leg shooter__leg--left">
                  <path d="M 51 140 L 47 165" stroke-width="11"/>
                  <path d="M 47 165 L 44 189" stroke-width="8"/>
                  <path class="shooter__sock" d="M 41.5 184 L 47.5 184" stroke-width="7"/>
                  <path class="shooter__shoe" d="M 33 190 Q 33 184 40 184 L 49 184 Q 55 184 55 190 L 55 194 Q 55 197 51 197 L 35 197 Q 32 197 32 194 Z"/>
                </g>
                <g class="shooter__leg shooter__leg--right">
                  <path d="M 74 140 L 77 165" stroke-width="11"/>
                  <path d="M 77 165 L 80 189" stroke-width="8"/>
                  <path class="shooter__sock" d="M 76.5 184 L 82.5 184" stroke-width="7"/>
                  <path class="shooter__shoe" d="M 68 190 Q 68 184 74 184 L 83 184 Q 90 184 90 190 L 90 194 Q 90 197 87 197 L 71 197 Q 68 197 68 194 Z"/>
                </g>

                <g class="shooter__torso">
                  <rect class="shooter__shorts" x="41" y="122" width="42" height="25" rx="9"/>
                  <rect class="shooter__jersey" x="39" y="81" width="46" height="48" rx="10"/>
                  <path class="shooter__jersey-trim" d="M 53 81 L 62 91 L 71 81 Z"/>
                  <rect class="shooter__jersey-stripe" x="39" y="81" width="4" height="48"/>
                  <rect class="shooter__jersey-stripe" x="81" y="81" width="4" height="48"/>
                  <rect class="shooter__shorts-stripe" x="41" y="122" width="4" height="25"/>
                  <rect class="shooter__shorts-stripe" x="79" y="122" width="4" height="25"/>
                  <text class="shooter__number" x="62" y="110" text-anchor="middle" dominant-baseline="central">23</text>
                </g>

                <g class="shooter__arm shooter__arm--guide">
                  <path d="M 41 91 L 31 109" stroke-width="9"/>
                  <path d="M 31 109 L 25 124" stroke-width="7"/>
                  <circle class="shooter__hand" cx="24" cy="127" r="5"/>
                </g>

                <g class="shooter__arm shooter__arm--throw">
                  <path d="M 83 91 L 94 108" stroke-width="9"/>
                  <path d="M 94 108 L 100 124" stroke-width="7"/>
                  <g class="shooter__hand">
                    <circle cx="100" cy="127" r="5.5"/>
                  </g>
                </g>

                <g class="shooter__head">
                  <circle cx="62" cy="65" r="12.5"/>
                  <path class="shooter__headband" d="M 49.5 62 A 12.5 12.5 0 0 1 74.5 62 L 74.5 57 L 49.5 57 Z"/>
                  <path class="shooter__brow" d="M 55.5 61.5 L 60 60 M 64 60 L 68.5 61.5"/>
                  <circle class="shooter__eye" cx="57.5" cy="65" r="1.4"/>
                  <circle class="shooter__eye" cx="66.5" cy="65" r="1.4"/>
                  <path class="shooter__mouth" d="M 58 71.5 Q 62 73.5 66 71.5"/>
                </g>
              </g>

              <g class="shooter__ball" id="success-ball">
                <g class="shooter__ball-body">
                  <circle cx="90" cy="113" r="11"/>
                  <path d="M 79 113 A 11 11 0 0 0 101 113"/>
                  <path d="M 90 102 A 11 11 0 0 1 90 124"/>
                  <path d="M 81.5 106.5 A 11 11 0 0 0 98.5 119.5"/>
                  <path d="M 81.5 119.5 A 11 11 0 0 1 98.5 106.5"/>
                </g>
              </g>
            </svg>
            <div class="success-overlay__result">
              <div class="success-overlay__title">Nothing but net</div>
              <div class="success-overlay__subtitle" id="success-subtitle"></div>
              <button class="btn btn--primary" id="next-level-btn">Next Level →</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="side-panel">
        <section class="panel-card">
          <h2 class="panel-card__label">Objective</h2>
          <p class="objective-text" id="objective-text"></p>
          <button class="hint-toggle" id="hint-toggle" aria-expanded="false" aria-controls="hint-text">
            <span class="hint-toggle__icon" aria-hidden="true">?</span>
            <span id="hint-toggle-label">Show hint</span>
          </button>
          <p class="hint-text" id="hint-text" hidden></p>
        </section>

        <section class="panel-card panel-card--editor">
          <div class="panel-card__header">
            <h2 class="panel-card__label">CSS Editor</h2>
          </div>
          <div id="editor-blocks"></div>
          <p class="check-message" id="check-message" role="status" aria-live="polite" hidden></p>
          <div class="editor-actions">
            <button class="btn" id="reset-btn">Reset</button>
            <button class="btn btn--primary" id="check-btn">Check Solution</button>
          </div>
          <div class="solved-counter" id="solved-counter"></div>
        </section>
      </aside>
    </main>

    <footer style="text-align: center; padding: 12px 0 16px; font-size: 0.8rem; color: var(--text-on-dark-muted, #93a0b8); opacity: 0.85; font-family: 'JetBrains Mono', monospace;">
      Submitted by Ori Peretz &amp; Guy Havia
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
